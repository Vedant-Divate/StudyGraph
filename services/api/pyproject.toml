[project]
name = "studygraph-api"
version = "0.0.0"
description = "StudyGraph FastAPI service (Phase 0 skeleton)"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.20.0",
  "fastapi==0.121.1",
  "httpx==0.28.1",
  "openai>=3.29.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.6",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "pymupdf>=1.28.2",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.1.4",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"] # FastAPI Depends/File defaults are the framework idiom

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
