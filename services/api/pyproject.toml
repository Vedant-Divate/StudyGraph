[project]
name = "studygraph-api"
version = "0.0.0"
description = "StudyGraph FastAPI service (Phase 0 skeleton)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.121.1",
  "httpx==0.28.1",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
