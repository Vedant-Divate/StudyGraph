services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studygraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-studygraph}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-studygraph}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ASR_BACKEND: ${ASR_BACKEND:-mock}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ASR_BACKEND: ${ASR_BACKEND:-mock}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
    command: python -m app.workers.runner

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
