name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: studygraph
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: studygraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studygraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LLM_PROVIDER: mock
      ASR_BACKEND: mock
      EMBED_BACKEND: hash
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: studygraph
      PGPASSWORD: changeme
      PGDATABASE: studygraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Verify API
        working-directory: services/api
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy app
          uv run --frozen pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (reads pnpm version from packageManager)
        run: corepack enable && pnpm --version
      - name: Verify web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: No secrets check
        run: ./scripts/check_no_secrets.sh
      - name: Build images (amd64)
        run: docker compose build
